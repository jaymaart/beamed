services:
  app:
    image: docker.io/vroles/solver-service:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    restart: "no"
    env_file:
      - .env
    ports:
      - "${SCRAPER_PORT:-8600}:8600"

