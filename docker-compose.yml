services:
  app:
    image: docker.io/vroles/solver-service:latest
    restart: unless-stopped
    environment:
      PORT: 8204
      ADMIN_PASSWORD: changeme
      SOLVER_PASSWORD: solver
      DATABASE_URL: postgres://solver:solver25@192.168.1.11:5432/solver-service
      ALLOWED_ORIGINS: https://dmdservers.com
    ports:
      - "8204:8204"

  scraper:
    image: docker.io/vroles/scraper-service:latest
    restart: unless-stopped
    environment:
      API_BASE: http://192.168.1.11:8204
      SCRAPER_SERVICE_URL: http://192.168.1.11:8600
    ports:
      - "8600:8600"
