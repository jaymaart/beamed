<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>reCAPTCHA Manual Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e5e7eb;
      margin: 0;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    }
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #0d1117;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      height: 140px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #0b0f1a;
      color: #e5e7eb;
      padding: 10px;
    }
    .muted { color: #9ca3af; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Manual Google reCAPTCHA Test</h2>
    <p class="muted">Enter your real reCAPTCHA site key below. This page only renders the widget and shows the token; it does not auto-submit anywhere.</p>
    <label for="siteKey">Site key</label>
    <input id="siteKey" type="text" placeholder="your-google-recaptcha-site-key" style="width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:#0b0f1a;color:#e5e7eb;margin-bottom:10px;">
    <div id="captcha-wrapper" style="margin:14px 0;"></div>
    <button id="render">Render reCAPTCHA</button>
    <textarea id="token" readonly placeholder="Token will appear here"></textarea>
    <div class="muted" style="margin-top:8px;">Note: reCAPTCHA tokens expire quickly; use immediately for verification.</div>
  </div>
  <script>
    let widgetId = null;
    const renderBtn = document.getElementById('render');
    const tokenBox = document.getElementById('token');
    const siteKeyInput = document.getElementById('siteKey');

    renderBtn.addEventListener('click', () => {
      const key = siteKeyInput.value.trim();
      if (!key) { alert('Enter a site key first'); return; }
      tokenBox.value = '';
      if (widgetId !== null && window.grecaptcha) {
        grecaptcha.reset(widgetId);
      }
      const renderNow = () => {
        widgetId = grecaptcha.render('captcha-wrapper', {
          sitekey: key,
          callback: (tok) => { tokenBox.value = tok; },
          'expired-callback': () => { tokenBox.value = 'Expired. Solve again.'; }
        });
      };
      if (window.grecaptcha && grecaptcha.render) {
        renderNow();
      } else {
        alert('reCAPTCHA script not loaded yet. Please wait a moment and try again.');
      }
    });
  </script>
</body>
</html>
